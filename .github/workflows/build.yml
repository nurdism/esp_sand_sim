name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # merge-bin folds bootloader + partition table + app into one image
      # flashable at offset 0, which is what the web flasher expects.
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: idf.py build merge-bin -o sand_sim.bin

      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp build/sand_sim.bin _site/
          sed "s/{{VERSION}}/${GITHUB_SHA::7}/" web/manifest.json > _site/manifest.json

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: sand_sim-${{ github.sha }}
          path: |
            build/sand_sim.bin
            build/esp_sim.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
